<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kamizu</title>
    
    <!-- Вытянутый готический шрифт (Pirata One) и утонченная антиква (Cinzel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kamizu</title>
    
    <!-- Вытянутый готический шрифт (Pirata One) и утонченная антиква (Cinzel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Pirata+One&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050507;
            /* Жидкое стекло: глубокий прозрачный градиент с сиянием по контуру */
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(20, 20, 26, 0.45) 50%, rgba(255, 255, 255, 0.02) 100%);
            --glass-border: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.2) 100%);
            --text-main: #f5f5f7;
            --text-dim: #8b8b96;
            --silver-glow: rgba(220, 220, 240, 0.4);
        }

        body {
            cursor: default;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(ellipse at 50% 15%, rgba(45, 45, 60, 0.45) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(25, 25, 35, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 15% 90%, rgba(20, 20, 30, 0.5) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px 0;
            position: relative;
        }

        /* Хромированный стеклянный шум */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.012) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 3px;
            z-index: 2;
            pointer-events: none;
        }

        a, button, input[type="range"], .enter-screen {
            cursor: pointer;
        }

        #ashCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        /* --- ЭКРАН ВХОДА (Жидкое затемненное стекло) --- */
        .enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: radial-gradient(circle, rgba(10, 10, 14, 0.8) 0%, rgba(5, 5, 7, 0.95) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s ease;
            user-select: none;
        }

        .enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-trigger {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            padding: 16px 36px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.3),
                inset 0 -1px 1px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: pulseGlass 3s infinite ease-in-out;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .enter-trigger:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 255, 255, 0.18),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .gothic-btn {
            font-family: 'Pirata One', cursive;
            font-size: 3.8rem;
            color: var(--text-main);
            letter-spacing: 5px;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
            line-height: 1;
        }

        .side-cross {
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.55);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            transition: transform 0.4s ease, color 0.4s ease;
        }

        .enter-trigger:hover .side-cross {
            color: #ffffff;
            transform: scale(1.2);
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
        }

        @keyframes pulseGlass {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* --- ОСНОВНОЙ КОРПУС: ЖИДКОЕ СТЕКЛО (LIQUID GLASS) --- */
        .container {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 440px;
            padding: 44px 30px;
            border-radius: 28px;
            
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            
            /* Стеклянные блики и глубина */
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.85),
                inset 0 1px 2px rgba(255, 255, 255, 0.35),
                inset 0 -2px 4px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 255, 255, 0.03);
            
            opacity: 0;
            transform: translateY(25px) scale(0.95);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Угловые готические кресты вместо простых уголков */
        .corner-cross {
            position: absolute;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.25);
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .container:hover .corner-cross {
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .cross-tl { top: 14px; left: 16px; }
        .cross-tr { top: 14px; right: 16px; }
        .cross-bl { bottom: 14px; left: 16px; }
        .cross-br { bottom: 14px; right: 16px; }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .title-cross {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .title-wrapper:hover .title-cross {
            color: #ffffff;
            transform: rotate(90deg);
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
        }

        h1 {
            font-family: 'Pirata One', cursive;
            font-size: 3.4rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.25);
            user-select: none;
            line-height: 1;
        }

        /* --- ЖИДКИЕ СТЕКЛЯННЫЕ КНОПКИ (GRID) --- */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 26px;
        }

        .link-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 13px 12px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e2e8;
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .link-item.featured {
            grid-column: span 2;
            padding: 15px 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .link-item i {
            font-size: 0.95rem;
            color: var(--text-dim);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
            border-color: rgba(255, 255, 255, 0.45);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(255, 255, 255, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .link-item:hover i {
            color: #ffffff;
            transform: scale(1.15);
        }

        /* --- СТЕКЛЯННЫЙ МЕДИАПЛЕЕР --- */
        .music-box {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0.45) 100%);
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .cover-art {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.25);
            filter: grayscale(80%) contrast(110%);
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: filter 0.4s ease;
        }

        .music-box:hover .cover-art {
            filter: grayscale(20%) contrast(110%);
        }

        .player-controls {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 74px);
            gap: 8px;
        }

        .track-name {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .slider-common {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            height: 12px;
        }

        .slider-common::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 11px;
            width: 5px;
            border-radius: 2px;
            background: #ffffff;
            margin-top: -4.5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .slider-common::-moz-range-thumb {
            height: 11px;
            width: 5px;
            border-radius: 2px;
            background: #ffffff;
            border: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .slider-common::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 1px;
        }

        .slider-common::-moz-range-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 1px;
        }

        .progress-slider {
            width: 100%;
        }

        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            background: none;
            border: none;
            color: #d4d4d8;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            transition: color 0.2s, transform 0.2s;
        }
        
        .play-btn:hover {
            color: #ffffff;
            transform: scale(1.18);
        }

        .time-text {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            user-select: none;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 70px;
            flex-shrink: 0;
        }

        .volume-box i {
            color: var(--text-dim);
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .volume-box i:hover {
            color: #ffffff;
        }

        .volume-slider {
            width: 100%;
        }

        @media (max-width: 480px) {
            .container { padding: 32px 18px; border-radius: 22px; }
            h1 { font-size: 2.8rem; }
            .links-grid { grid-template-columns: 1fr; }
            .link-item.featured { grid-column: span 1; }
            .gothic-btn { font-size: 3rem; }
            .enter-trigger { padding: 12px 26px; gap: 14px; }
        }
    </style>
</head>
<body>

    <!-- Канвас с поднимающимся пеплом/искрами -->
    <canvas id="ashCanvas"></canvas>

    <!-- Экран входа: Стеклянная плашка с крестами и словом *нажимай* -->
    <div class="enter-screen" id="enterScreen">
        <div class="enter-trigger">
            <span class="side-cross">✠</span>
            <div class="gothic-btn">нажимай</div>
            <span class="side-cross">✠</span>
        </div>
    </div>

    <!-- Основная карточка профиля (Жидкое стекло с крестами) -->
    <div class="container" id="mainContainer">
        <!-- Готические угловые кресты -->
        <span class="corner-cross cross-tl">✠</span>
        <span class="corner-cross cross-tr">✠</span>
        <span class="corner-cross cross-bl">✠</span>
        <span class="corner-cross cross-br">✠</span>

        <!-- Заголовок с боковыми акцентными крестами -->
        <div class="title-wrapper">
            <span class="title-cross">♰</span>
            <h1 id="titleName">kamizchuk</h1>
            <span class="title-cross">♰</span>
        </div>

        <!-- Сетка кнопок из жидкого стекла -->
        <div class="links-grid">
            <a href="https://steamcommunity.com/id/kamizchuk/" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-steam-symbol"></i> Steam
            </a>
            <a href="https://t.me/kamizchuk" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="https://youtube.com/@kamizchuk?si=OacBrP33uK_nkmfv" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://discord.com/users/1226305136582856896" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-discord"></i> Discord
            </a>
            
            <!-- Manga по центру внизу сетки -->
            <a href="https://nude-moon.org/perevod/kamizu_kun" target="_blank" rel="noopener noreferrer" class="link-item featured">
                <i class="fas fa-torii-gate"></i> Manga Translation
            </a>
        </div>

        <!-- Медиаплеер в стеклянной огранке -->
        <div class="music-box">
            <img src="cover.jpg" alt="Cover" class="cover-art" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=200&auto=format&fit=crop'">
            
            <div class="player-controls">
                <div class="track-name" title="Cannibalism">Cannibalism</div>
                
                <input type="range" class="slider-common progress-slider" id="progressSlider" min="0" max="100" value="0" step="0.1">
                
                <div class="bottom-controls">
                    <div class="left-controls">
                        <button class="play-btn" id="playBtn" aria-label="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="time-text">
                            <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                        </div>
                    </div>
                    
                    <div class="volume-box">
                        <i class="fas fa-volume-up" id="volumeIcon" title="Mute"></i>
                        <input type="range" class="slider-common volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>

                <audio id="audioElement" preload="metadata">
                    <source src="cannibalism.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script>
        // --- 1. АНИМАЦИЯ ВКЛАДКИ (Печать kamizu) ---
        const targetTitle = "kamizu";
        let charIndex = 0;
        let isDeleting = false;

        function typeTitle() {
            if (!isDeleting) {
                charIndex++;
                document.title = targetTitle.substring(0, charIndex);
                if (charIndex === targetTitle.length) {
                    isDeleting = true;
                    setTimeout(typeTitle, 1400);
                    return;
                }
            } else {
                charIndex--;
                document.title = targetTitle.substring(0, charIndex) || "_";
                if (charIndex === 0) {
                    isDeleting = false;
                    setTimeout(typeTitle, 400);
                    return;
                }
            }
            setTimeout(typeTitle, isDeleting ? 140 : 220);
        }
        typeTitle();

        // --- 2. ВХОД И АВТОСТАРТ АУДИО ---
        const enterScreen = document.getElementById('enterScreen');
        const mainContainer = document.getElementById('mainContainer');
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');

        enterScreen.addEventListener('click', () => {
            enterScreen.classList.add('hidden');
            mainContainer.classList.add('visible');

            audio.play().then(() => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(e => console.log('Аудио ожидает взаимодействия:', e));
        });

        // --- 3. ПЛЕЕР ---
        const progressSlider = document.getElementById('progressSlider');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        let isDragging = false;
        let prevVolume = 0.5;
        audio.volume = volumeSlider.value;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressSlider.max = audio.duration;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isDragging) {
                currentTimeEl.textContent = formatTime(audio.currentTime);
                progressSlider.value = audio.currentTime;
            }
        });

        progressSlider.addEventListener('mousedown', () => isDragging = true);
        progressSlider.addEventListener('touchstart', () => isDragging = true, { passive: true });
        progressSlider.addEventListener('input', () => {
            currentTimeEl.textContent = formatTime(progressSlider.value);
        });

        const syncSeek = () => {
            audio.currentTime = progressSlider.value;
            isDragging = false;
        };
        progressSlider.addEventListener('change', syncSeek);
        progressSlider.addEventListener('mouseup', syncSeek);
        progressSlider.addEventListener('touchend', syncSeek);

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volumeIcon.className = audio.volume == 0 ? "fas fa-volume-mute" : "fas fa-volume-up";
        });

        volumeIcon.addEventListener('click', () => {
            if (audio.volume > 0) {
                prevVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeIcon.className = "fas fa-volume-mute";
            } else {
                audio.volume = prevVolume || 0.5;
                volumeSlider.value = audio.volume;
                volumeIcon.className = "fas fa-volume-up";
            }
        });

        playBtn.addEventListener('click', () => {
            if (audio.paused) audio.play();
            else audio.pause();
        });

        audio.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
        audio.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
        audio.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.currentTime = 0;
        });

        // --- 4. МЕДЛЕННО ВОСХОДЯЩИЙ ПЕПЕЛ (ASH PARTICLES) ---
        const canvas = document.getElementById('ashCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const count = window.innerWidth < 600 ? 40 : 80;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.6,
                speedY: Math.random() * 0.7 + 0.2,
                speedX: (Math.random() - 0.5) * 0.4,
                opacity: Math.random() * 0.6 + 0.15
            });
        }

        function renderAsh() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = `rgba(220, 220, 230, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(renderAsh);
        }
        renderAsh();
    </script>
</body>
</html>
