<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamizchuk</title>
    
    <!-- Подключение пиксельных шрифтов -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Подключение иконок FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #2a111a, #0a0a0a);
            background-size: 300% 300%;
            animation: gradientShift 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'VT323', monospace;
            overflow: hidden; 
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Дождь */
        #rainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; 
            pointer-events: none;
        }

        /* Главный блок с блюром */
        .container {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            
            background: rgba(20, 10, 15, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.4rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px rgba(255, 105, 180, 0.5);
            letter-spacing: 1px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Ссылки */
        .links {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 15px;
            margin-bottom: 25px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .link-item:hover {
            background: rgba(255, 105, 180, 0.15);
            border-color: rgba(255, 105, 180, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        /* --- КАСТОМНЫЙ ПЛЕЕР (В ОДНОМ ЦВЕТЕ) --- */
        .music-box {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .cover-art {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 105, 180, 0.4);
        }

        .player-controls {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
        }

        .track-name {
            font-size: 1.2rem;
            color: #ffb6c1; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        .controls-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        /* Кнопка Play/Pause */
        .play-btn {
            background: none;
            border: none;
            color: #ff69b4;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
        }
        
        .play-btn:hover {
            color: #ffb6c1;
            transform: scale(1.1);
        }

        /* Ползунок громкости */
        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ff69b4;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.8);
        }

        .volume-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 105, 180, 0.2);
            border-radius: 2px;
        }

        /* Уведомление Discord */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #222;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 100;
            bottom: 30px;
            font-size: 1.2rem;
            border: 1px solid #ff69b4;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.2rem; }
            .link-item { font-size: 1.3rem; padding: 12px; }
        }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="container">
        <h1>Kamizchuk</h1>

        <div class="links">
            <a href="https://steamcommunity.com/id/kamizchuk/" target="_blank" class="link-item">
                <i class="fab fa-steam"></i> Steam
            </a>
            <a href="https://t.me/kamizchuk" target="_blank" class="link-item">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <a href="https://youtube.com/@kamizchuk?si=OacBrP33uK_nkmfv" target="_blank" class="link-item">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="#" onclick="copyDiscord(event)" class="link-item">
                <i class="fab fa-discord"></i> Discord
            </a>
        </div>

        <!-- КАСТОМНЫЙ ПЛЕЕР -->
        <div class="music-box">
            <!-- ЗДЕСЬ УКАЗАНА ТВОЯ ОБЛОЖКА: cover.jpg -->
            <img src="cover.jpg" alt="Cover" class="cover-art" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=200&auto=format&fit=crop'">
            
            <div class="player-controls">
                <div class="track-name">Cannibalism</div>
                
                <div class="controls-row">
                    <!-- Кнопка Play/Pause -->
                    <button class="play-btn" id="playBtn">
                        <i class="fas fa-play"></i>
                    </button>
                    <!-- Ползунок громкости -->
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                </div>

                <!-- Невидимый элемент аудио -->
                <audio id="audioElement">
                    <source src="cannibalism.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <div id="toast">Юзернейм скопирован!</div>

    <script>
        // --- Логика Кастомного Плеера ---
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        // Громкость по умолчанию на 50%
        audio.volume = volumeSlider.value;

        // Включение / Пауза
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });

        // Смена иконки при воспроизведении
        audio.addEventListener('play', () => {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        });

        // Смена иконки при паузе
        audio.addEventListener('pause', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        });

        // Когда песня заканчивается, возвращаем иконку Play
        audio.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        });

        // Изменение громкости ползунком
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });


        // --- Копирование Discord ---
        function copyDiscord(e) {
            e.preventDefault();
            navigator.clipboard.writeText("kamizchuk").then(function() {
                var toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(function(){ 
                    toast.className = toast.className.replace("show", ""); 
                }, 3000);
            }).catch(function(err) {
                console.error('Ошибка копирования: ', err);
            });
        }

        // --- Эффект дождя ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const drops = [];
        for(let i = 0; i < 120; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 15 + 10,
                speed: Math.random() * 4 + 2
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255, 105, 180, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            
            for(let i = 0; i < drops.length; i++) {
                let d = drops[i];
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.length);
                d.y += d.speed;
                
                if(d.y > canvas.height) {
                    d.y = -d.length;
                    d.x = Math.random() * canvas.width;
                }
            }
            ctx.stroke();
            requestAnimationFrame(drawRain);
        }
        drawRain();
    </script>
</body>
</html>
