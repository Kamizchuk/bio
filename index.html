<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kamizu</title>
    
    <!-- Вытянутый готический шрифт (Pirata One) и утонченная антиква (Cinzel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Pirata+One&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #08080a;
            --card-bg: rgba(14, 14, 18, 0.7);
            --border-dim: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(255, 255, 255, 0.6);
            --text-main: #f0f0f2;
            --text-dim: #7d7d85;
            --accent-silver: #d4d4d8;
        }

        body {
            cursor: default;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(35, 35, 45, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(15, 15, 20, 0.8) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px 0;
            position: relative;
        }

        /* Тончайшая зернистая вуаль */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.015) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 3px;
            z-index: 2;
            pointer-events: none;
        }

        a, button, input[type="range"], .enter-screen {
            cursor: pointer;
        }

        #ashCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        /* --- ЭКРАН ВХОДА --- */
        .enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(8px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s ease;
            user-select: none;
        }

        .enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gothic-btn {
            font-family: 'Pirata One', cursive;
            font-size: 4.5rem;
            color: var(--text-main);
            letter-spacing: 6px;
            text-transform: lowercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            animation: pulseGothic 3s infinite ease-in-out;
            transition: all 0.4s ease;
        }

        .enter-screen:hover .gothic-btn {
            transform: scale(1.08);
            letter-spacing: 9px;
            text-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulseGothic {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        /* --- ОСНОВНАЯ КАРТОЧКА --- */
        .container {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 440px;
            padding: 42px 30px;
            
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-dim);
            box-shadow: 
                0 0 0 1px rgba(0, 0, 0, 0.8),
                0 25px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Двойная тонкая готическая полоса по углам */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
        .container::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .container::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        h1 {
            font-family: 'Pirata One', cursive;
            font-size: 3.2rem;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 4px;
            text-transform: capitalize;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.15);
            user-select: none;
            transition: transform 0.2s ease;
        }

        /* --- СЕТКА КНОПОК (GRID) --- */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 30px;
        }

        .link-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-dim);
            color: var(--accent-silver);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Manga на всю ширину снизу */
        .link-item.featured {
            grid-column: span 2;
            padding: 15px 10px;
            border-color: rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.035);
        }

        .link-item i {
            font-size: 0.95rem;
            color: var(--text-dim);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-glow);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .link-item:hover i {
            color: #ffffff;
            transform: scale(1.15);
        }

        /* --- МИНИМАЛИСТИЧНЫЙ МЕДИАПЛЕЕР --- */
        .music-box {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            padding: 14px 16px;
            border: 1px solid var(--border-dim);
        }

        .cover-art {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            filter: grayscale(85%) contrast(110%);
            flex-shrink: 0;
            transition: filter 0.4s ease;
        }

        .music-box:hover .cover-art {
            filter: grayscale(40%) contrast(110%);
        }

        .player-controls {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 74px);
            gap: 8px;
        }

        .track-name {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        /* Слайдеры */
        .slider-common {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            height: 12px;
        }

        .slider-common::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            width: 4px;
            background: #ffffff;
            margin-top: -4px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .slider-common::-moz-range-thumb {
            height: 10px;
            width: 4px;
            background: #ffffff;
            border: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .slider-common::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
        }

        .slider-common::-moz-range-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
        }

        .progress-slider {
            width: 100%;
        }

        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            background: none;
            border: none;
            color: var(--accent-silver);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            transition: color 0.2s, transform 0.2s;
        }
        
        .play-btn:hover {
            color: #ffffff;
            transform: scale(1.15);
        }

        .time-text {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            user-select: none;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 70px;
            flex-shrink: 0;
        }

        .volume-box i {
            color: var(--text-dim);
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .volume-box i:hover {
            color: #ffffff;
        }

        .volume-slider {
            width: 100%;
        }

        @media (max-width: 480px) {
            .container { padding: 32px 20px; }
            h1 { font-size: 2.7rem; }
            .links-grid { grid-template-columns: 1fr; }
            .link-item.featured { grid-column: span 1; }
            .gothic-btn { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- Канвас с поднимающимся пеплом/искрами -->
    <canvas id="ashCanvas"></canvas>

    <!-- Экран входа с готическим текстом *тыкни* -->
    <div class="enter-screen" id="enterScreen">
        <div class="gothic-btn">*тыкни*</div>
    </div>

    <!-- Основная карточка профиля -->
    <div class="container" id="mainContainer">
        <h1 id="titleName">kamizchuk</h1>

        <!-- Новая сетка кнопок -->
        <div class="links-grid">
            <a href="https://steamcommunity.com/id/kamizchuk/" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-steam-symbol"></i> Steam
            </a>
            <a href="https://t.me/kamizchuk" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="https://youtube.com/@kamizchuk?si=OacBrP33uK_nkmfv" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://discord.com/users/1226305136582856896" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-discord"></i> Discord
            </a>
            
            <!-- Manga по центру внизу сетки -->
            <a href="https://nude-moon.org/perevod/kamizu_kun" target="_blank" rel="noopener noreferrer" class="link-item featured">
                <i class="fas fa-torii-gate"></i> Manga Translation
            </a>
        </div>

        <!-- Медиаплеер -->
        <div class="music-box">
            <img src="cover.jpg" alt="Cover" class="cover-art" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=200&auto=format&fit=crop'">
            
            <div class="player-controls">
                <div class="track-name" title="Cannibalism">Cannibalism</div>
                
                <input type="range" class="slider-common progress-slider" id="progressSlider" min="0" max="100" value="0" step="0.1">
                
                <div class="bottom-controls">
                    <div class="left-controls">
                        <button class="play-btn" id="playBtn" aria-label="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="time-text">
                            <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                        </div>
                    </div>
                    
                    <div class="volume-box">
                        <i class="fas fa-volume-up" id="volumeIcon" title="Mute"></i>
                        <input type="range" class="slider-common volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>

                <audio id="audioElement" preload="metadata">
                    <source src="cannibalism.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script>
        // --- 1. АНИМАЦИЯ ВКЛАДКИ (Печать kamizu) ---
        const targetTitle = "kamizu";
        let charIndex = 0;
        let isDeleting = false;

        function typeTitle() {
            if (!isDeleting) {
                charIndex++;
                document.title = targetTitle.substring(0, charIndex);
                if (charIndex === targetTitle.length) {
                    isDeleting = true;
                    setTimeout(typeTitle, 1400);
                    return;
                }
            } else {
                charIndex--;
                document.title = targetTitle.substring(0, charIndex) || "_";
                if (charIndex === 0) {
                    isDeleting = false;
                    setTimeout(typeTitle, 400);
                    return;
                }
            }
            setTimeout(typeTitle, isDeleting ? 140 : 220);
        }
        typeTitle();

        // --- 2. ВХОД И АВТОСТАРТ АУДИО ---
        const enterScreen = document.getElementById('enterScreen');
        const mainContainer = document.getElementById('mainContainer');
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');

        enterScreen.addEventListener('click', () => {
            enterScreen.classList.add('hidden');
            mainContainer.classList.add('visible');

            audio.play().then(() => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }).catch(e => console.log('Аудио ожидает взаимодействия:', e));
        });

        // --- 3. ПЛЕЕР ---
        const progressSlider = document.getElementById('progressSlider');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        let isDragging = false;
        let prevVolume = 0.5;
        audio.volume = volumeSlider.value;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressSlider.max = audio.duration;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isDragging) {
                currentTimeEl.textContent = formatTime(audio.currentTime);
                progressSlider.value = audio.currentTime;
            }
        });

        progressSlider.addEventListener('mousedown', () => isDragging = true);
        progressSlider.addEventListener('touchstart', () => isDragging = true, { passive: true });
        progressSlider.addEventListener('input', () => {
            currentTimeEl.textContent = formatTime(progressSlider.value);
        });

        const syncSeek = () => {
            audio.currentTime = progressSlider.value;
            isDragging = false;
        };
        progressSlider.addEventListener('change', syncSeek);
        progressSlider.addEventListener('mouseup', syncSeek);
        progressSlider.addEventListener('touchend', syncSeek);

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volumeIcon.className = audio.volume == 0 ? "fas fa-volume-mute" : "fas fa-volume-up";
        });

        volumeIcon.addEventListener('click', () => {
            if (audio.volume > 0) {
                prevVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeIcon.className = "fas fa-volume-mute";
            } else {
                audio.volume = prevVolume || 0.5;
                volumeSlider.value = audio.volume;
                volumeIcon.className = "fas fa-volume-up";
            }
        });

        playBtn.addEventListener('click', () => {
            if (audio.paused) audio.play();
            else audio.pause();
        });

        audio.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
        audio.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
        audio.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.currentTime = 0;
        });

        // --- 4. МЕДЛЕННО ВОСХОДЯЩИЙ ПЕПЕЛ (ASH PARTICLES) ---
        const canvas = document.getElementById('ashCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const count = window.innerWidth < 600 ? 40 : 80;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.6,
                speedY: Math.random() * 0.7 + 0.2,
                speedX: (Math.random() - 0.5) * 0.4,
                opacity: Math.random() * 0.6 + 0.15
            });
        }

        function renderAsh() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = `rgba(220, 220, 230, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(renderAsh);
        }
        renderAsh();
    </script>
</body>
</html>
